# Polls release feeds into the admin inbox (08 RSS-Updates). Needs repo secrets CLOUDFLARE_API_TOKEN (D1 edit) and CLOUDFLARE_ACCOUNT_ID.
# Off until the owner turns it on: uncomment `schedule`. Run by hand from the Actions tab meanwhile.
name: feeds
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 6 * * *'
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run feeds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
